<!doctype html>
<html lang="en">
  <head>
    <!-- Character encoding -->
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Mobile responsive viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Website title -->
    <title>Fusive Fashion</title>

    <!-- Social preview image -->
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />

    <!-- Google Font (Jost) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- ===================================================== -->
    <!-- 🔥 CRITICAL FIRST LOAD STYLES (APP SHELL LOADER) -->
    <!-- This prevents FOOTER FLASH & layout jump -->
    <!-- Shows loader until React + Tailwind fully load -->
    <!-- ===================================================== -->
    <style>
      /* Fullscreen loader container */
      #app-loader {
        position: fixed;
        inset: 0;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 999999;
        font-family: "Jost", sans-serif;
      }

      /* Spinner animation */
      .loader-spinner {
        width: 42px;
        height: 42px;
        border: 3px solid #eeeeee;
        border-top: 3px solid #000000;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <!-- ===================================================== -->
    <!-- 🔥 INITIAL HTML LOADER -->
    <!-- Browser shows this instantly BEFORE React loads -->
    <!-- Prevents showing broken layout / footer flash -->
    <!-- ===================================================== -->
    <div id="app-loader">
      <div class="loader-spinner"></div>
    </div>

    <!-- React App Mount Point -->
    <div id="root"></div>

    <!-- Vite entry -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
